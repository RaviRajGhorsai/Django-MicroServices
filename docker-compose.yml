services:

  # ── Databases (one per service) ────────────────────────
  job-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB_JOB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5400:5432" 
    volumes:
      - job_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  candidate-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB_CANDIDATE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5401:5432" 
    volumes:
      - candidate_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5


# ── Kafka (KRaft) ───────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS} 
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR} 
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE} 
      CLUSTER_ID: ${CLUSTER_ID} 
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      retries: 5

  # ── OpenSearch ─────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      retries: 5
  
   # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6700:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5


# ── Job Service ────────────────────────────────────────
  job-service:
    build: ./job-service
    ports:
      - "8000:8000"
    env_file: ./job-service/.env
    volumes:
    - ./job-service:/app
    depends_on:
      job-db:     { condition: service_healthy }
      
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
  
  job-worker:
    build: ./job-service
    env_file: ./job-service/.env
    volumes:
    - ./job-service:/app
    depends_on:
      job-db: { condition: service_healthy }
      redis:  { condition: service_healthy }
    command: celery -A config worker -l info -Q job-service
  
  job-consumer:
    build: ./job-service
    env_file: ./job-service/.env
    volumes:
    - ./job-service:/app
    depends_on:
      kafka:  { condition: service_healthy }
      job-db: { condition: service_healthy }
    command: python manage.py run_consumer


  # ── Candidate Service ──────────────────────────────────
  candidate-service:
    build: ./candidate-service
    ports:
      - "8777:8777"
    env_file: ./candidate-service/.env
    volumes:
    - ./candidate-service:/app
    depends_on:
      candidate-db: { condition: service_healthy }
      
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8777"

volumes:
  job_db_data:
  candidate_db_data:
  opensearch_data:



